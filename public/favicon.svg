<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Khairabad Railway Station Signboard Identity -->
  <rect x="6" y="6" width="116" height="116" rx="20" fill="#fec200" stroke="#000000" stroke-width="8"/>
  <rect x="14" y="14" width="100" height="100" rx="14" fill="#fec200" stroke="#000000" stroke-width="2"/>
  <!-- Hindi: ख़ैराबाद (अवध) -->
  <text x="64" y="46" text-anchor="middle" font-size="26" font-weight="900" font-family="'Mukta', 'Noto Sans Devanagari', -apple-system, sans-serif" fill="#000000">ख़ैराबाद</text>
  <!-- English: KHAIRABAD -->
  <text x="64" y="72" text-anchor="middle" font-size="18" font-weight="900" font-family="'Anton', 'Oswald', 'Impact', sans-serif" letter-spacing="1.2" fill="#000000">KHAIRABAD</text>
  <!-- Urdu: خیر آباد -->
  <text x="64" y="96" text-anchor="middle" font-size="20" font-weight="bold" font-family="'Noto Nastaliq Urdu', 'Scheherazade New', 'Amiri', sans-serif" fill="#000000">خیر آباد</text>
  <!-- PIN Code -->
  <text x="64" y="113" text-anchor="middle" font-size="10" font-weight="800" font-family="sans-serif" fill="#000000" letter-spacing="0.8">PIN 261131</text>
</svg>
